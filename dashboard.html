<!DOCTYPE html>
<html>
<head>
    <title>Manage Locations</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 40%; margin-right: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #00875A; color: white; border: none; border-radius: 5px; cursor: pointer; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .delete-btn { color: red; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📍 Delivery Settings</h2>
        <form method="POST">
            <input type="text" name="name" placeholder="Location (e.g. Lugait)" required>
            <input type="number" step="0.01" name="fee" placeholder="Base Fee ₱" required>
            <button type="submit">Add</button>
        </form>

        <table>
            <tr><th>Location</th><th>Base Fee</th><th>Action</th></tr>
            {% for loc in locations %}
            <tr>
                <td>{{ loc.name }}</td>
                <td>₱{{ loc.base_df }}</td>
                <td><a href="/delete/{{ loc.id }}" class="delete-btn">Remove</a></td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <a href="/">Go to Calculator →</a>
    </div>
</body>
</html>
